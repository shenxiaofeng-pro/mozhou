[project]
name = "mozhou-api"
version = "0.1.0"
description = "墨舟本地优先小说工作台 API"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "pypdf>=6.16.1,<7",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "mypy>=1.15,<2",
  "pyinstaller>=6.16,<7",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
