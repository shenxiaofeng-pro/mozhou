name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            pytest_addopts: ""
          - os: windows-2022
            pytest_addopts: "-n 4 --dist=loadfile --tb=short --durations=20"
    env:
      PYTEST_ADDOPTS: ${{ matrix.pytest_addopts }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked toolchains and dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          uv python install 3.14
          uv sync --project services/api --frozen
      - name: Run complete verification gate
        shell: bash
        run: pnpm run verify

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          uv python install 3.14
          uv sync --project services/api --frozen
      - name: Guard repository and audit JavaScript dependencies
        run: |
          pnpm run guard:repository
          pnpm audit --audit-level high
      - name: Audit Python dependencies
        run: |
          uv export --project services/api --frozen --all-groups --no-emit-project --format requirements-txt --output-file python-requirements.txt
          uvx pip-audit --requirement python-requirements.txt
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          working-directory: apps/desktop/src-tauri
          token: ${{ secrets.GITHUB_TOKEN }}
